<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del producto</title>
        <link rel="icon" type="image/svg+xml" href="/assets/images/logo/logo-loop.svg" />
    <link rel="stylesheet" href="../../css/base/base.css" />
    <link rel="stylesheet" href="../../css/base/fonts.css" />
    <link rel="stylesheet" href="../../css/general/footer.css" />
    <link rel="stylesheet" href="../../css/general/header.css" />
    <link rel="stylesheet" href="../../css/main/product.css" />
    
  </head>
  <body>
    <div id="header-container"></div>

    <nav class="nav-bar">
      <ul class="categories" id="categories-container"></ul>

      <div class="header-icons">

        <a href="../shoppingCart/cart.html" class="icon-btn cart-link">
          <img
            src="../../assets/icons/navigation/cart.svg"
            alt="Carrito"
            class="icon"
          />
          <span class="cart-badge" id="cart-badge" hidden></span>
        </a>

        <div id="estadoSesion" class="estado-sesion">
          <a href="../login/index_login.html" class="icon-btn">
              <img
                src="../../assets/icons/navigation/user.svg"
                alt="Cuenta"
                class="icon"
              />
          </a>
        </div>
      </div>
    </nav>

    <main class="product-detail-page">
        <section id="product-detail" class="product-detail"></section>

        <section id="seller-section" class="seller-section" hidden>
            <div class="seller-header">
                <h2>Más de este vendedor</h2>
                <a href="#" class="see-all" id="seller-closet-link">Ver closet</a>
            </div>
            <div class="seller-items" id="seller-items"></div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script type="module" src="../../js/general/reuse.js"></script>
    <script src="../../js/general/product-utils.js"></script>
    <script src="../../js/shoppingCart/cartService.js"></script>
    <script src="../../js/main/product.js"></script>
  </body>
</html>
