<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/logo/logo-loop.svg"
    />
    <link rel="stylesheet" href="../../css/base/base.css" />
    <link rel="stylesheet" href="../../css/login/style_login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="login-container">
      <a href="../../index.html" class="close-login" id="cerrarLogin">
        &times;
      </a>

      <h1>Iniciar sesión</h1>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ingresa tu correo"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
          />
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>

      <p id="estado"></p>

      <p class="register-link">
        ¿No tienes una cuenta?
        <a href="registro.html">Regístrate aquí</a>
      </p>
    </div>

    <script src="../../js/login/script_login.js"></script>
  </body>
</html>
