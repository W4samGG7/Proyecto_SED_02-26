<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
      <link rel="stylesheet" href="../../css/base/base.css">
  <link rel="stylesheet" href="../../css/login/style_login.css">
</head>

<body>

  <div class="login-container registro-container">

    <a href="../../index.html" class="close-login" id="cerrarRegistro">
        &times;
    </a>

    <h1>Registrarse</h1>

    <form id="registroForm" method="post" novalidate>

      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ingresa tu nombre"
          maxlength="50"
          autocomplete="given-name"
          required
        >
        <p class="error-text" data-for="nombre"></p>
      </div>

      <div class="input-group">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          name="apellido"
          placeholder="Ingresa tu apellido"
          maxlength="50"
          autocomplete="family-name"
          required
        >
        <p class="error-text" data-for="apellido"></p>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ingresa tu correo"
          maxlength="100"
          autocomplete="email"
          required
        >
        <p class="error-text" data-for="email"></p>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          maxlength="64"
          autocomplete="new-password"
          required
        >
        <p class="error-text" data-for="password"></p>
      </div>

      <div class="input-group">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          type="password"
          id="confirmarPassword"
          name="confirmarPassword"
          placeholder="Repite tu contraseña"
          maxlength="64"
          autocomplete="new-password"
          required
        >
        <p class="error-text" data-for="confirmarPassword"></p>
      </div>

      <button type="submit">Registrarse</button>

    </form>

    <p id="estado"></p>

    <p class="register-link">
      ¿Ya tienes una cuenta?
      <a href="index_login.html">Inicia sesión</a>
    </p>

  </div>

  <script src="../../js/script_registro.js"></script>

</body>
</html>
