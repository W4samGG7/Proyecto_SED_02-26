services:
  mysql:
    image: mysql:8.0
    container_name: proyecto_SED
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:?falta DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?falta DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}

    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/tienda_ropa.sql:/docker-entrypoint-initdb.d/tienda_ropa.sql:ro

volumes:
  mysql_data:
